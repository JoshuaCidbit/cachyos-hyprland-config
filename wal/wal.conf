# ~/.config/wal/wal.conf
# Configuración del sistema de wallpapers
# Formato: CLAVE=valor (sin espacios alrededor del =)
# Prioridad: variables de entorno > este archivo > valores por defecto

# Directorio de búsqueda de wallpapers
# WALL_DIR="/home/joshua/Pictures/wallpapers/1080p"

# Transición de cambio (wipe|wave|fade|slide|none)
WALL_TRANSITION="wipe"

# Duración de la transición en segundos
WALL_TRANSITION_DUR="1"

# Ángulo del barrido en grados (solo para wipe/wave)
# 0=derecha→izquierda, 90=arriba→abajo, 270=abajo→arriba
# 45 → barrido diagonal de arriba derecha hacia abajo izquierda
WALL_TRANSITION_ANGLE="45"

# Paso de interpolación por frame (para wipe/wave: 255=rasgado nítido,
# sin mezcla; <255 crea una franja de degradado durante el barrido)
WALL_TRANSITION_STEP="255"

# FPS de la transición
WALL_TRANSITION_FPS="120"

# Monitor de Hyprland a tratar (por defecto: todos)
# MONITOR="*"
