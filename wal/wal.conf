# ~/.config/wal/wal.conf
# Configuración del sistema de wallpapers
# Formato: CLAVE=valor (sin espacios alrededor del =)
# Prioridad: variables de entorno > este archivo > valores por defecto

# Directorio de búsqueda de wallpapers
# WALL_DIR="/home/joshua/Pictures/wallpapers/1080p"

# Transición de cambio (wipe|fade|slide|none)
WALL_TRANSITION="wipe"

# Duración de la transición en segundos
WALL_TRANSITION_DUR="1"

# Monitor de Hyprland a tratar (por defecto: todos)
# MONITOR="*"
